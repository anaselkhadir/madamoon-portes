# Met une porte en ligne chez Hostinger, par FTP.
#
# Déclenchement à la main seulement, comme pour madamoon.fr.
#
# madamoon.fr ne doit jamais être touché. Trois verrous y veillent :
#
#   1. Les identifiants ne sont pas ceux du site. Chaque domaine est un
#      site à part dans hPanel, avec son propre compte FTP, dont la racine
#      est son propre dossier : ce compte ne voit pas celui de madamoon.fr.
#      Les secrets portent un autre nom (PORTE_FTP_*) pour qu'on ne puisse
#      pas y coller ceux du site par mégarde.
#
#   2. Avant tout envoi, le dossier distant est lu. S'il contient un
#      « sitemap.xml » ou un « robots.txt » qui nomme madamoon.fr, c'est
#      le site officiel : l'envoi s'arrête là, sans rien écrire.
#
#   3. La page compilée doit annoncer le domaine visé comme adresse
#      canonique. Une compilation faite pour un autre domaine ne part pas.
#
# Secrets à créer dans ce dépôt (Settings → Secrets → Actions), avec le
# compte FTP du site robedemariéeparis.fr (hPanel → ce site → Comptes FTP) :
# PORTE_FTP_SERVEUR, PORTE_FTP_UTILISATEUR, PORTE_FTP_MOTDEPASSE.
name: Mise en ligne Hostinger

on:
  workflow_dispatch:
    inputs:
      # Sous sa forme DNS : robedemariéeparis.fr s'écrit ainsi une fois
      # l'accent encodé. C'est cette forme que porte l'adresse canonique.
      domaine:
        description: Domaine de la porte, forme DNS, sans https://
        default: xn--robedemarieparis-kqb.fr
        required: true
      dossier:
        description: Dossier de destination, vu depuis le compte FTP de ce domaine
        default: /public_html/
        required: true

concurrency:
  group: hostinger-portes
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Le domaine n'est pas madamoon.fr
        run: |
          case "${{ inputs.domaine }}" in
            madamoon.fr|www.madamoon.fr|*.madamoon.fr)
              echo "::error::Ce workflow ne publie jamais madamoon.fr."; exit 1;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export statique
        env:
          NEXT_PUBLIC_PORTE: https://${{ inputs.domaine }}
        run: npm run build:domaine

      - name: La page annonce le bon domaine
        run: |
          grep -q '<link rel="canonical" href="https://${{ inputs.domaine }}/"' out/index.html \
            || { echo "::error::L'adresse canonique n'est pas https://${{ inputs.domaine }}/"; exit 1; }

      - name: Le dossier distant n'est pas madamoon.fr
        env:
          SERVEUR: ${{ secrets.PORTE_FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.PORTE_FTP_UTILISATEUR }}
          # lftp lit le mot de passe dans cette variable (« --env-password ») :
          # passé dans « -u utilisateur,motdepasse », une virgule ou une
          # barre oblique inverse du mot de passe le couperait.
          LFTP_PASSWORD: ${{ secrets.PORTE_FTP_MOTDEPASSE }}
          DOSSIER: ${{ inputs.dossier }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p distant
          # La liste doit se lire : un dossier qu'on ne peut pas voir est un
          # dossier qu'on ne sait pas protéger, et rien ne part.
          #
          # Hostinger donne le serveur FTP par son adresse IP, et son
          # certificat est émis au nom de ses machines (*.hstgr.io) : le nom
          # ne peut donc pas correspondre. On garde la vérification du
          # certificat lui-même — une chaîne Let's Encrypt valide — et l'on
          # ne renonce qu'à la comparaison du nom. L'envoi qui suit, celui de
          # FTP-Deploy-Action, ne vérifie rien de plus : c'est son réglage
          # par défaut, le même que pour madamoon.fr.
          OPTS="set ftp:ssl-force true; set ssl:check-hostname no;"
          lftp -u "$UTILISATEUR" --env-password "$SERVEUR" \
            -e "$OPTS cls -1 '$DOSSIER' > distant/liste.txt; bye" \
            || { echo "::error::Dossier distant illisible. Rien n'a été envoyé."; exit 1; }
          echo "Contenu du dossier distant :"; cat distant/liste.txt
          # Les deux fichiers peuvent manquer sur un dossier neuf.
          lftp -u "$UTILISATEUR" --env-password "$SERVEUR" \
            -e "$OPTS cd '$DOSSIER'; get -O distant sitemap.xml; get -O distant robots.txt; bye" || true
          if grep -qi "madamoon.fr" distant/sitemap.xml distant/robots.txt 2>/dev/null; then
            echo "::error::Ce dossier est celui de madamoon.fr. Rien n'a été envoyé."; exit 1
          fi
          # Les rubriques que seul le site possède.
          if grep -qiE "(^|/)(createurs|morphologies|coupes|showroom)/?$" distant/liste.txt; then
            echo "::error::Ce dossier contient les rubriques de madamoon.fr. Rien n'a été envoyé."; exit 1
          fi

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PORTE_FTP_SERVEUR }}
          username: ${{ secrets.PORTE_FTP_UTILISATEUR }}
          password: ${{ secrets.PORTE_FTP_MOTDEPASSE }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ inputs.dossier }}
          dangerous-clean-slate: false
